name: Build Windows executable

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch: {}

jobs:
  build-win:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt pyinstaller
      - run: pyinstaller music_organizer.spec
      - uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: dist/MusicLibraryOrganizer.exe
          if-no-files-found: error
      # Tag pushes (v1.2.3) also publish a GitHub Release with the .exe
      # attached -- that's what the in-app self-updater checks. Plain
      # pushes to main just build an artifact for quick manual testing.
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" "dist/MusicLibraryOrganizer.exe" --title "${{ github.ref_name }}" --generate-notes
